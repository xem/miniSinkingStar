<!doctype html>
<script src='terser.5.14.1.js'></script>
<script src="pako.min.js"></script>

<body style="font:14px arial, sans-serif">
<a href="index.html" style="float:right;color:#000;text-decoration:none">☰</a>
<h3>MiniSinkingStar JS minifier + Gzipper</h3>

<p><b>JS code</b>
<p>
<textarea id=t rows=25 cols=80 placeholder="paste JS code here" style="width:95%;height:250px;font-size:8px"></textarea>
<p>
  <input type=checkbox id=mini checked hidden>
  <input type=checkbox id=html checked> add HTML around JS code (canvas + script tags)
</p>

<p><button id=go>GO</button>

<p><b>Raw size</b> <input readonly id=raw value=0> bytes
<p><b>Min size</b> <input readonly id=min value=0> bytes
<p><b>Gzip size</b> <input readonly id=gz value=0> bytes

<script>
let minify = async () => {

  var js = t.value;
  var rawjs = js;
  
  if(mini.checked){
    js = js.replace(/;+$/,";");
    try{
      let terser = await Terser.minify(
        js, 
        {
          toplevel: true,
          compress: {
            passes: 5,
            unsafe: true,
            pure_getters: true,
          }
        }
      )

      js = terser.code;
      js = js.replace(/;+$/,"");
      t.value = js;
      originalBuffer = new TextEncoder().encode(js.replace("evalprompt()","eval(prompt())").replace("50*S[p]","S[p]*50"));
      min.value = mini.checked ? originalBuffer.length + (html.checked && (t.value[0]!="<") ? 53 : 0) : 0;
    } catch(e){min.value = "invalid JS"; console.log(e);}
  }
  
  finalcode = (html.checked && (t.value[0]!="<") ? "<canvas id=a style=border:solid+9px><script>" : "") + js.replace("evalprompt()","eval(prompt())").replace("50*S[p]","S[p]*50") + (html.checked && (t.value[0]!="<") ? "<\/script>" : "");
  originalBuffer = new TextEncoder().encode(finalcode);
  t.value = finalcode;
  compressed = pako.gzip(originalBuffer, { level: 9 });
  gz.value = compressed.length;
  raw.value = new TextEncoder().encode(rawjs).length + (html.checked && (t.value[0]!="<") ? 53 : 0);
}

go.onclick = () => {
  minify();
}
</script>
</body>
