<!doctype html>
<script src='terser.5.14.1.js'></script>
<script src="pako.min.js"></script>

<body style="font:14px arial, sans-serif">
<a href="index.html" style="float:right;color:#000;text-decoration:none">☰</a>
<h3>MiniSinkingStar JS minifier + Gzipper</h3>

<p><b>JS code</b>
<p>
  <input type=checkbox id=mini checked> Minify
</p>
<textarea id=t rows=25 cols=80 placeholder="paste code here" style="width:95%;height:250px;font-size:8px"></textarea>

<p><b>Raw size</b> <input readonly id=raw value=0> bytes
<p><b>Min size</b> <input readonly id=min value=0> bytes
<p><b>Gzip size</b> <input readonly id=gz value=0> bytes

<script>
let minify = async () => {

  var js = t.value;
  var rawjs = js;
  
  if(mini.checked){
    js = js.replace(/;+$/,";");
    
    let terser = await Terser.minify(
      js, 
      {
        toplevel: true,
        compress: {
          passes: 5,
          unsafe: true,
          pure_getters: true,
        }
      }
    )

    js = terser.code;
    js = js.replace(/;+$/,"");
    t.value = js;
  }
  
  const originalBuffer = new TextEncoder().encode(js);
  const compressed = pako.gzip(originalBuffer, { level: 9 });
  gz.value = compressed.length;
  min.value = mini.checked ? originalBuffer.length : 0;
  raw.value = new TextEncoder().encode(rawjs).length;
}

onchange = oninput = () => {
  minify();
}
</script>
</body>
